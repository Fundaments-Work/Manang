[plugin]
name = "live"
version = "0.1.0"
description = "Edit a file or a whole project together in real time. End-to-end encrypted through a relay you choose; the file on disk stays plain text."
tier = "native"

[contributes]
[[contributes.commands]]
id = "live.start"
title = "Share this file live"

[[contributes.commands]]
id = "live.join"
title = "Join a live session"

[[contributes.commands]]
id = "live.leave"
title = "Leave the live session"

[[contributes.commands]]
id = "live.invite"
title = "Copy the live invite"

[[contributes.commands]]
id = "live.status"
title = "Live session status"

[[contributes.commands]]
id = "live.inspect"
title = "Read what a live invite points at"

[[contributes.commands]]
id = "live.push"
title = "Send local edits to the live session"

[[contributes.commands]]
id = "live.selection"
title = "Share the caret with the live session"

[[contributes.commands]]
id = "live.snapshot"
title = "Re-read the live document"

[[contributes.commands]]
id = "live.contributors"
title = "List who edited in the live session"

[[contributes.commands]]
id = "live.resync"
title = "Rebuild the live document from the others"

[[contributes.commands]]
id = "live.configure"
title = "Apply live editing settings"

[[contributes.commands]]
id = "live.resolve"
title = "Apply the choices for joining a live project"

[[contributes.commands]]
id = "live.attach"
title = "Start editing a file of the live session"

[[contributes.commands]]
id = "live.detach"
title = "Stop editing a file of the live session"

[[contributes.commands]]
id = "live.follow"
title = "Follow a person in the live session"

[[contributes.commands]]
id = "live.files"
title = "List the files of the live session"

[[contributes.commands]]
id = "live.exclude"
title = "Keep a file out of the live session"

[[contributes.commands]]
id = "live.include"
title = "Put a file back into the live session"

[[contributes.commands]]
id = "live.restore"
title = "Restore a file deleted in the live session"

[[contributes.settings]]
id = "live.relay-url"
type = "string"
default = "wss://relay.fundaments.work"
title = "Relay address"
description = "Where live sessions meet. The default is the relay run by Fundaments; you can point this at your own, for example wss://relay.example.org. The relay forwards encrypted data and cannot read your text. Empty turns sharing off; joining uses the address in the invite."

[[contributes.settings]]
id = "live.display-name"
type = "string"
default = ""
title = "Name shown to collaborators"
description = "Shown next to your caret. Empty uses your system user name."

[[contributes.settings]]
id = "live.email"
type = "string"
default = ""
title = "Email shared with collaborators (optional)"
description = "Shared only with the people in a live session, so a version you save together can credit them with Co-authored-by. Empty shares none; those people are then named in the version's message instead."
