[package]
name = "manang-plugins"
description = "Discovery, loading and hot reload of Manang WASM plugins"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
manang-kernel = { path = "../manang-kernel" }
manang-wasm-host = { path = "../manang-wasm-host" }
blake3 = "1.8"
notify = "8"
parking_lot = "0.12"
rayon = "1.12"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = "0.8"
# `.manangplugin` archives: pure Rust (zlib-rs inflate, no C library), MIT.
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
insta = "1"
proptest = "1"
tempfile = "3"
wat = "1"
wit-component = "0.262"
wit-parser = "0.262"
