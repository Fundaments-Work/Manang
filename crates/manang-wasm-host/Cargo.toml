[package]
name = "manang-wasm-host"
description = "Sandboxed WASM plugin tier for Manang, on the Wasmtime component model"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
manang-kernel = { path = "../manang-kernel" }
blake3 = "1.8"
cap-std = "4"
getrandom = "0.4"
parking_lot = "0.12"
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror = { workspace = true }
ureq = { version = "3", default-features = false, features = ["rustls"] }
wasmtime = { version = "49", default-features = false, features = [
    "std",
    "runtime",
    "cranelift",
    "component-model",
    "pooling-allocator",
] }

[dev-dependencies]
wit-component = "0.262"
wit-parser = "0.262"
wat = "1"
criterion = { version = "0.8", default-features = false }
tempfile = "3"

[[bench]]
name = "call_overhead"
harness = false
