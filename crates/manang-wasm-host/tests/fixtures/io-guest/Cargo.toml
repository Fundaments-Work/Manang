[package]
name = "io-guest"
version = "0.0.0"
edition = "2024"
publish = false

# A standalone workspace: the fixture targets wasm32-unknown-unknown and must
# not be built as part of the Manang workspace.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
wit-bindgen = "0.63"
