[plugin]
name = "heal"
version = "0.1.0"
description = "Self-healing: deterministic one-click fixes for small compile errors (a missing package, an unclosed delimiter)"
tier = "native"
settings_contexts = ["document"]

# Pure text in, edits out: no filesystem, no network, no process.
[permissions]

[contributes]

[[contributes.commands]]
id = "heal.suggest"
title = "Suggest fixes for compile errors"

[[contributes.commands]]
id = "heal.configure"
title = "Apply self-healing settings"

[[contributes.settings]]
id = "heal.enabled"
type = "bool"
default = true
title = "Offer one-click fixes"
description = "Show a Fix button on errors that have a mechanical fix: a missing package, an unclosed delimiter."

[[contributes.settings]]
id = "heal.auto-apply"
type = "bool"
default = false
title = "Apply certain fixes on save"
description = "When you save, apply the fixes that have exactly one reading (such as a missing \\usepackage) and say so. Off by default."
