[plugin]
name = "editor"
version = "0.1.0"
description = "Document store, edits and the active-buffer service"
tier = "native"

[permissions]
buffer = ["write:active"]

[contributes]
[[contributes.commands]]
id = "editor.new"
title = "New document"

[[contributes.commands]]
id = "editor.open"
title = "Open document"

[[contributes.commands]]
id = "editor.save"
title = "Save document"

[[contributes.commands]]
id = "editor.activate"
title = "Switch document"

[[contributes.commands]]
id = "editor.insert"
title = "Insert text"

[[contributes.commands]]
id = "editor.delete"
title = "Delete range"

[[contributes.commands]]
id = "editor.text"
title = "Read document text"

[[contributes.commands]]
id = "editor.info"
title = "Document info"

[[contributes.commands]]
id = "editor.undo"
title = "Undo latest edit"

[[contributes.commands]]
id = "editor.redo"
title = "Redo latest undone edit"

[[contributes.commands]]
id = "editor.replace"
title = "Replace text range"

[[contributes.commands]]
id = "editor.slice"
title = "Read text range"

[[contributes.commands]]
id = "editor.line-col"
title = "Convert character index to line and column"
