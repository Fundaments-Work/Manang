# Built-in scientific snippets.
#
# Body syntax: `${1:placeholder}` is a tab stop with default text, `${2}` or
# `$2` an empty one, a repeated index mirrors the first, `$0` is the final
# cursor position. A literal `$` followed by `{` or a digit is written `\$`.

# ---------------------------------------------------------------- theorem

[[snippet]]
trigger = "theorem"
aliases = ["thm"]
syntax = "typst"
name = "Theorem"
description = "Theorem block with a name and a label"
body = '''
#block(width: 100%, inset: (left: 1em), stroke: (left: 0.5pt))[
  *Theorem (${1:name}).* ${2:Statement.}
] <thm:${3:label}>
$0'''

[[snippet]]
trigger = "theorem"
aliases = ["thm"]
syntax = "latex"
name = "Theorem"
description = "Theorem environment (needs amsthm and \\newtheorem{theorem}{Theorem})"
requires = "amsthm"
body = '''
\begin{theorem}[${1:name}]\label{thm:${2:label}}
  ${3:Statement.}
\end{theorem}
$0'''

[[snippet]]
trigger = "theorem"
aliases = ["thm"]
syntax = "markdown"
name = "Theorem"
description = "Theorem as a block quote"
body = '''
> **Theorem (${1:name}).** ${2:Statement.}

$0'''

