[package]
name = "manang-writing"
description = "Manang's first-party writing tools plugin: formatting, spelling, prose lint, symbols, snippets and statistics"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
# typstyle-core 0.15 requires Rust 1.92.
rust-version.workspace = true

[dependencies]
manang-kernel = { path = "../manang-kernel" }
# Typst parser (same version as manang-typst) and formatter.
typst-syntax = "=0.15.1"
typstyle-core = "=0.15.2"
# Hunspell-compatible spell checker (MPL-2.0, used unmodified).
spellbook = "=0.4.2"
# Dictionary decompression (pure Rust miniz_oxide backend).
flate2 = "1.1"
# Markdown structure for masking code, math and links.
pulldown-cmark = { version = "0.13", default-features = false }
parking_lot = "0.12"
rayon = "1"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = "0.8"

[dev-dependencies]
# Compiled-output equivalence checks for the Typst formatter.
manang-typst = { path = "../manang-typst" }
typst = "=0.15.1"
criterion = { version = "0.5", default-features = false }
insta = { version = "1", features = ["json"] }
proptest = "1"
tempfile = "3"

[[bench]]
name = "writing"
harness = false
