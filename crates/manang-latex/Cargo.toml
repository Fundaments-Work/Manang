[package]
name = "manang-latex"
description = "Manang's first-party LaTeX plugin: Tectonic compilation, diagnostics and SyncTeX"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
flate2 = "1"
manang-heal = { path = "../manang-heal" }
manang-kernel = { path = "../manang-kernel" }
parking_lot = "0.12"
serde = { workspace = true }
serde_json = { workspace = true }
tectonic = { version = "=0.17.0", optional = true }
tectonic_bundles = { version = "=0.4.2", optional = true }
tempfile = "3"
thiserror = { workspace = true }
wait-timeout = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# Links Tectonic (and its bundled HarfBuzz). Enabled only to build the
# `manang-latex-worker` sidecar; the host app must not enable it, or the static
# HarfBuzz overrides the system one and crashes GTK/WebKit at startup.
engine = ["dep:tectonic", "dep:tectonic_bundles"]

[[bin]]
name = "manang-latex-worker"
path = "src/bin/manang-latex-worker.rs"
required-features = ["engine"]

[dev-dependencies]
criterion = { version = "0.8", default-features = false }
insta = { version = "1", features = ["json"] }
proptest = "1"

[[bench]]
name = "latex"
harness = false
