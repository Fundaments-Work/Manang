[plugin]
name = "latex"
version = "0.1.0"
description = "LaTeX compilation with the system TeX (optional Tectonic), structured diagnostics and SyncTeX"
tier = "native"

[permissions]
filesystem = ["read:project", "write:cache"]

[contributes]
hooks = ["on_lint"]

[[contributes.commands]]
id = "latex.status"
title = "LaTeX engines available"

[[contributes.commands]]
id = "latex.compile"
title = "Compile LaTeX"

[[contributes.commands]]
id = "latex.export-pdf"
title = "Export PDF"

[[contributes.commands]]
id = "latex.synctex"
title = "SyncTeX source/PDF lookup"
