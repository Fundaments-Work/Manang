[package]
name = "manang-markdown"
description = "Manang's first-party Markdown parser, HTML renderer and Typst converter"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
manang-kernel = { path = "../manang-kernel" }
manang-visual = { path = "../manang-visual" }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = "1"
yaml-rust = "0.4"

[dev-dependencies]
manang-diagram = { path = "../manang-diagram" }
manang-project = { path = "../manang-project" }
tempfile = "3"
insta = { version = "1", features = ["json"] }
proptest = "1"
