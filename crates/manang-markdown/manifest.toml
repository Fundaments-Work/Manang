[plugin]
name = "markdown"
version = "0.1.0"
description = "Markdown rendering, outline extraction, XSS sanitization, and Typst conversion"
tier = "native"
settings_contexts = ["engine:markdown"]

[contributes]
[[contributes.commands]]
id = "markdown.render-html"
title = "Render Markdown to sanitized HTML"

[[contributes.commands]]
id = "markdown.outline"
title = "Extract Markdown document outline"

[[contributes.commands]]
id = "markdown.to-typst"
title = "Convert Markdown to Typst markup"

[[contributes.commands]]
id = "markdown.diagrams"
title = "List the diagram fences of a Markdown document"
