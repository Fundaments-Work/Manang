[plugin]
name = "typst"
version = "0.1.0"
description = "Typst compiler: incremental compile, SVG page render, PDF export and source/preview jumps"
tier = "native"
settings_contexts = ["engine:typst"]

[permissions]
filesystem = ["read:project"]

[contributes]
hooks = ["on_lint"]

[[contributes.commands]]
id = "typst.compile"
title = "Compile Typst document"

[[contributes.commands]]
id = "typst.check"
title = "Check Typst sources for problems without changing the preview"

[[contributes.commands]]
id = "typst.render"
title = "Render page as SVG"

[[contributes.commands]]
id = "typst.export-pdf"
title = "Export PDF"

[[contributes.commands]]
id = "typst.jump-from-click"
title = "Jump from preview to source"

[[contributes.commands]]
id = "typst.jump-from-cursor"
title = "Jump from source to preview"

[[contributes.commands]]
id = "typst.svg-to-pdf"
title = "Convert an SVG to a one-page PDF"

[[contributes.commands]]
id = "typst.math-to-svg"
title = "Render a formula to vector SVG"

[[contributes.format-adapters]]
id = "typst"
title = "Typst"
extensions = ["typ"]
document-type = "typst"
kinds = ["heading", "strong", "emph", "code", "code-block", "list-item", "link", "image", "math", "ref", "label", "comment", "marker", "opaque"]
commands = ["bold", "italic", "code", "heading", "list", "link", "image", "figure", "math"]
