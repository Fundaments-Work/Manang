[package]
name = "manang-typst"
description = "Manang's first-party Typst compiler plugin"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
manang-kernel = { path = "../manang-kernel" }
typst = "=0.15.1"
typst-kit = { version = "=0.15.1", features = ["embedded-fonts", "scan-fonts", "system-packages"] }
typst-layout = "=0.15.1"
typst-ide = "=0.15.1"
typst-svg = "=0.15.1"
typst-pdf = "=0.15.1"
parking_lot = "0.12"
quick-xml = "0.42"
rayon = "1"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
insta = { version = "1", features = ["json"] }
proptest = "1"
tempfile = "3"

[[bench]]
name = "compile"
harness = false

[[bench]]
name = "pdf"
harness = false
