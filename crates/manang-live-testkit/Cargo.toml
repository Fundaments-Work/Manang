[package]
name = "manang-live-testkit"
description = "Test fixture for the live-editing tests: an in-process WebSocket fan-out. Not a relay."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "net", "sync", "macros"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
