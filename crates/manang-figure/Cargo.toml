[package]
name = "manang-figure"
description = "Typed SVG scene graph and deterministic headless renderer for Manang"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# dagre port for figure.layout (MIT OR Apache-2.0); already in the tree via merman.
dugong = "=0.9.0"
manang-kernel = { path = "../manang-kernel" }
parking_lot = "0.12"
perfect_freehand = "0.1.1"
quick-xml = "0.42"
# RaTeX (MIT), already in the tree through merman: LaTeX math to outline
# paths with the KaTeX fonts embedded; pure Rust, no C library.
ratex-layout = "=0.1.15"
ratex-parser = "=0.1.15"
ratex-svg = { version = "=0.1.15", features = ["embed-fonts"] }
ratex-types = "=0.1.15"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
manang-diagram = { path = "../manang-diagram" }
criterion = { version = "0.8", default-features = false }
manang-project = { path = "../manang-project" }
manang-typst = { path = "../manang-typst" }
insta = { version = "1", features = ["json"] }
proptest = "1"
tempfile = "3"


[[bench]]
name = "figure_ops"
harness = false
