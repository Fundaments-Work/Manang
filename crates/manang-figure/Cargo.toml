[package]
name = "manang-figure"
description = "Typed SVG scene graph and deterministic headless renderer for Manang"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
manang-kernel = { path = "../manang-kernel" }
parking_lot = "0.12"
perfect_freehand = "0.1.1"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
criterion = { version = "0.8", default-features = false }
quick-xml = "0.42"
manang-project = { path = "../manang-project" }
manang-typst = { path = "../manang-typst" }
insta = { version = "1", features = ["json"] }
proptest = "1"
tempfile = "3"


[[bench]]
name = "figure_ops"
harness = false
