[package]
name = "manang-figure"
description = "Typed SVG scene graph and deterministic headless renderer for Manang"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Fundaments.work"]
repository = "https://github.com/Fundaments-Work/Manang"
rust-version = "1.85"

[dependencies]
perfect_freehand = "0.1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
insta = "1"
proptest = "1"
