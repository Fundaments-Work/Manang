[plugin]
name = "figure"
version = "0.1.0"
description = "Typed SVG scene graph, deterministic headless renderer and vector studio"
tier = "native"
settings_contexts = ["figure"]

[permissions]
filesystem = ["write:project"]

[contributes]
hooks = ["register_agent_tool"]
[[contributes.commands]]
id = "figure.create"
title = "New figure"

[[contributes.commands]]
id = "figure.open"
title = "Open figure"

[[contributes.commands]]
id = "figure.save"
title = "Save figure"

[[contributes.commands]]
id = "figure.close"
title = "Close figure"

[[contributes.commands]]
id = "figure.list"
title = "List open figures"

[[contributes.commands]]
id = "figure.apply"
title = "Apply edit operation"

[[contributes.commands]]
id = "figure.get"
title = "Get figure scene"

[[contributes.commands]]
id = "figure.render-svg"
title = "Render a scene to SVG"

[[contributes.commands]]
id = "figure.export-svg"
title = "Export SVG"

[[contributes.commands]]
id = "figure.hit-test"
title = "Hit test coordinates"

[[contributes.commands]]
id = "figure.describe"
title = "Describe a figure (agent tool)"

[[contributes.commands]]
id = "figure.add-shapes"
title = "Add shapes (agent tool)"

[[contributes.commands]]
id = "figure.connect"
title = "Connect shapes (agent tool)"

[[contributes.commands]]
id = "figure.update"
title = "Change shapes (agent tool)"

[[contributes.commands]]
id = "figure.remove"
title = "Remove shapes (agent tool)"

[[contributes.commands]]
id = "figure.layout"
title = "Lay out a figure"

[[contributes.commands]]
id = "figure.from-mermaid"
title = "Insert Mermaid as shapes"

[[contributes.commands]]
id = "figure.to-mermaid"
title = "Figure as Mermaid"

[[contributes.commands]]
id = "figure.style"
title = "Apply a style preset"

[[contributes.commands]]
id = "figure.export"
title = "Save and export a figure"
