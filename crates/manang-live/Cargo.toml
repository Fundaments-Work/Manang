[package]
name = "manang-live"
description = "Live co-editing core for Manang: CRDT text, rope bridge, encrypted envelope, session state machine"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
manang-buffer = { path = "../manang-buffer" }
ropey = "1.6"
parking_lot = "0.12"
loro = "1.16"
yrs = { version = "0.28", optional = true }
chacha20poly1305 = "0.11"
hkdf = "0.13"
sha2 = "0.11"
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
serde = { workspace = true }
thiserror = { workspace = true }
zeroize = "1"

[features]
# A second CRDT behind the same `TextCrdt` trait, kept for the engine comparison
# (benches, `examples/measure`) and the trait's conformance tests. Not used by
# sessions, so it stays out of the app build.
yrs-engine = ["dep:yrs"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.4"

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
proptest = "1"
insta = "1"

[[bench]]
name = "bridge"
harness = false
