[package]
name = "manang-search"
description = "Manang's first-party search plugin: fuzzy file finder, project-wide text search, atomic replace and in-document find"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
# manang-project (gix) requires Rust 1.88.
rust-version = "1.88"

[dependencies]
blake3 = "1.8"
globset = "0.4"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
manang-kernel = { path = "../manang-kernel" }
manang-project = { path = "../manang-project" }
nucleo-matcher = "0.3"
parking_lot = "0.12"
rayon = "1.12"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
criterion = { version = "0.8", default-features = false }
insta = "1"
proptest = "1"
tempfile = "3"

[[bench]]
name = "search"
harness = false
