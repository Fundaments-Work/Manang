[plugin]
name = "agent"
version = "0.1.0"
description = "AI writing assistant: chat and slash commands with your own provider key. Every change is a proposal you accept."
tier = "native"
settings_contexts = ["app", "project", "document"]

[contributes]
hooks = ["register_agent_tool"]

[[contributes.commands]]
id = "agent.start"
title = "Start an AI agent session"

[[contributes.commands]]
id = "agent.cancel"
title = "Stop an AI agent session"

[[contributes.commands]]
id = "agent.approve"
title = "Answer an AI agent approval request"

[[contributes.commands]]
id = "agent.apply-proposal"
title = "Accept an AI proposal"

[[contributes.commands]]
id = "agent.reject-proposal"
title = "Reject an AI proposal"

[[contributes.commands]]
id = "agent.preview-request"
title = "Preview exactly what would be sent to the AI provider"

[[contributes.commands]]
id = "agent.commands"
title = "List the slash commands of the AI assistant"

[[contributes.commands]]
id = "agent.sessions"
title = "List AI sessions"

[[contributes.commands]]
id = "agent.transcript"
title = "Read an AI session transcript"

[[contributes.commands]]
id = "agent.models"
title = "List the models of an AI provider"

[[contributes.commands]]
id = "agent.test-connection"
title = "Test the AI provider connection and key"

[[contributes.commands]]
id = "agent.status"
title = "Report whether the AI agent is ready"

[[contributes.commands]]
id = "agent.consent"
title = "Record consent to send data to an AI provider"

[[contributes.commands]]
id = "agent.configure"
title = "Apply AI agent settings"

[[contributes.commands]]
id = "agent.key.set"
title = "Save an AI provider API key"

[[contributes.commands]]
id = "agent.key.status"
title = "Report whether an AI provider key is stored, and where"

[[contributes.commands]]
id = "agent.key.clear"
title = "Remove an AI provider API key"

[[contributes.commands]]
id = "agent.list-files"
title = "Agent tool: list the project's text sources"

[[contributes.commands]]
id = "agent.read-file"
title = "Agent tool: read a project file"

[[contributes.commands]]
id = "agent.search"
title = "Agent tool: search the project"

[[contributes.commands]]
id = "agent.outline"
title = "Agent tool: outline of a file or the project"

[[contributes.commands]]
id = "agent.diagnostics"
title = "Agent tool: list the problems, optionally with pending edits"

[[contributes.commands]]
id = "agent.bib-search"
title = "Agent tool: search the bibliography"

[[contributes.commands]]
id = "agent.edit-text"
title = "Agent tool: propose a text edit as search and replace pairs"

[[contributes.commands]]
id = "agent.ask-user"
title = "Agent tool: ask the author a question"

[[contributes.settings]]
id = "agent.enabled"
type = "bool"
default = true
title = "Enable the AI agent"
description = "Nothing is sent until you pick a provider and press Send."

[[contributes.settings]]
id = "agent.provider"
type = "enum"
values = ["anthropic", "openai", "deepseek", "openrouter", "groq", "ollama", "llama_cpp", "lm_studio", "custom"]
default = "anthropic"
title = "Provider"
description = "Who answers your requests."

[[contributes.settings]]
id = "agent.model"
type = "string"
default = ""
title = "Model"
description = "Empty uses the provider's first model."

[[contributes.settings]]
id = "agent.base-url"
type = "string"
default = ""
title = "Base URL"
description = "Empty uses the provider's default address."

[[contributes.settings]]
id = "agent.client"
type = "enum"
values = ["rig", "builtin"]
default = "rig"
title = "Provider client"
description = "rig is the default; builtin is the fallback."

[[contributes.settings]]
id = "agent.offline"
type = "bool"
default = false
title = "Offline mode"
description = "Only contact providers on this machine."

[[contributes.settings]]
id = "agent.include-thinking"
type = "bool"
default = false
title = "Developer: stream the model's reasoning"
description = "Send the model's reasoning to the event stream (for debugging)."

[[contributes.settings]]
id = "agent.context-window"
type = "int"
min = 8000
max = 1000000
default = 100000
title = "Working window (tokens)"
description = "Tokens kept before old results are cleared and older turns summarised."

[[contributes.settings]]
id = "agent.reasoning-effort"
type = "enum"
values = ["auto", "low", "high"]
default = "auto"
title = "Reasoning effort"
description = "For models that support it. auto: low for slash commands, high for chat."

[[contributes.settings]]
id = "agent.use-agents-md"
type = "bool"
default = false
title = "Use AGENTS.md as project instructions"
description = "Read AGENTS.md or CLAUDE.md when there is no MANANG.md."

[[contributes.settings]]
id = "agent.redact-emails"
type = "bool"
default = false
title = "Redact email addresses"
description = "Replace email addresses in what is sent."

[[contributes.settings]]
id = "agent.redact-paths"
type = "bool"
default = false
title = "Redact user names in paths"
description = "Replace the user name in home paths in what is sent."

[[contributes.settings]]
id = "agent.retention-days"
type = "int"
min = 0
max = 3650
default = 30
title = "Keep sessions (days)"
description = "Delete older sessions at startup. 0 keeps all."
