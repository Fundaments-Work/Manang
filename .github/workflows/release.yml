name: release

# Builds the installers and publishes a GitHub Release.
#
#   git tag v0.1.0-beta.1 && git push origin v0.1.0-beta.1
#
# or Actions > release > Run workflow (give the tag; it must already exist).
# A tag with a "-" in it (v0.1.0-beta.1) is published as a pre-release. The
# release notes come from docs/release-notes/<tag>.md, so write that file
# before tagging. Installers are unsigned for now; docs/user/install.md tells
# people what to expect from Windows SmartScreen and macOS Gatekeeper.
#
# This is the only workflow that uses macOS and Windows runners. It runs on a
# public repository, where GitHub does not meter minutes; keep it that way.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, for example v0.1.0-beta.1"
        required: true

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  prepare:
    name: draft release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Check the version and the release notes
        run: |
          version="${TAG#v}"
          conf="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "${version%%-*}" != "$conf" ]; then
            echo "::error::tag $TAG does not match tauri.conf.json version $conf (the part before any -suffix must match)"
            exit 1
          fi
          test -s "docs/release-notes/${TAG}.md" || {
            echo "::error::write docs/release-notes/${TAG}.md before tagging"
            exit 1
          }
      - name: Create the draft release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" --draft $flags --verify-tag \
            --title "Manang ${TAG#v}" --notes-file "docs/release-notes/${TAG}.md"
          id="$(gh release view "$TAG" --json databaseId --jq .databaseId)"
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.label }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64 (deb, rpm; the AppImage is replaced by pack-linux.sh)
            os: ubuntu-24.04
            args: ""
            rust_targets: ""
          - label: windows-x86_64 (msi, exe)
            os: windows-2025
            args: ""
            rust_targets: ""
          - label: macos-apple-silicon (dmg)
            os: macos-15
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
          - label: macos-intel (dmg)
            os: macos-15
            args: --target x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: System libraries for the Tauri shell
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev libayatana-appindicator3-dev libxdo-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev patchelf rpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.rust_targets }}
          cache-on-failure: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and upload the installers
        uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Addresses the app embeds (see docs/ops/registry.md). The engine host
          # is left unset until the engine is published; with it unset the app
          # says the engine is not available yet (the placeholder never resolves).
          MANANG_CHANNEL: beta
          MANANG_REGISTRY_URL: https://registry.fundaments.work
        with:
          projectPath: .
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: ${{ matrix.args }}

  publish:
    name: publish
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Pack the Linux artifacts, checksum, publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir assets && cd assets
          gh release download "$TAG" --pattern '*' --dir .
          # scripts/pack-linux.sh drops the AppImage (it bundled a 120 MB
          # copy of WebKitGTK), writes the tarball that replaces it and
          # recompresses the .deb with xz. Whatever it changes here has to
          # change on the release too, so diff the directory before and after.
          find . -maxdepth 1 -type f -printf '%f\n' | sort > ../before.txt
          bash ../../scripts/pack-linux.sh
          find . -maxdepth 1 -type f -printf '%f\n' | sort > ../after.txt
          while read -r f; do
            grep -qxF "$f" ../after.txt || { echo "removing $f"; gh release delete-asset "$TAG" "$f"; }
          done < ../before.txt
          for f in *.deb *.tar.xz; do
            [ -e "$f" ] || continue
            echo "replacing $f"
            gh release upload "$TAG" "$f" --clobber
          done
          rm -f SHA256SUMS.txt ../before.txt ../after.txt
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber
          gh release edit "$TAG" --draft=false
