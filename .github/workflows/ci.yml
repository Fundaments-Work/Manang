name: CI

# The gates of AGENTS.md section 5, on Linux. macOS and Windows runners cost
# more minutes and are used for release builds, not for every push.
#
# Minutes are the budget on a private repository, so a change that touches only
# documentation runs nothing, and the long UI suite runs on pull requests, every
# night and on demand rather than on every push to main (it also runs locally
# before each merge).
on:
  push:
    branches: [main]
    paths-ignore:
      ["docs/**", "**/*.md", "LICENSE", "CITATION.cff", ".github/ISSUE_TEMPLATE/**"]
  pull_request:
    paths-ignore:
      ["docs/**", "**/*.md", "LICENSE", "CITATION.cff", ".github/ISSUE_TEMPLATE/**"]
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"
  # No debug info in CI builds: the target folder was filling the runner's disk
  # (the cache step failed unpacking crates) and builds were slower for nothing.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 60 # a cold cache builds Typst and Wasmtime
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        # The runner starts with little free space for a workspace this size.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: System libraries for the Tauri shell
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev libayatana-appindicator3-dev libxdo-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev patchelf
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0" # the version we develop on; bump deliberately
          components: rustfmt, clippy
          # The plugin SDK and sandbox tests build WebAssembly plugins.
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked --no-fail-fast

  web-capable:
    name: wasm32 check of the web-capable crates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: >
          cargo check --locked --target wasm32-unknown-unknown
          -p manang-agent-core -p manang-figure -p manang-diagram

  supply-chain:
    name: Licences, bans, dependency tree
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - name: No bundled C libraries in the app binary (AGENTS.md 7.4)
        run: |
          if cargo tree -p manang --locked | grep -iE "tectonic|harfbuzz|freetype-sys|icu4c|openssl-sys|openssl v|aws-lc"; then
            echo "::error::a banned crate is in the app's dependency tree"
            exit 1
          fi
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
          # The action defaults to --all-features, which would include the
          # optional Tectonic sidecar engine; deny.toml checks the app's graph.
          arguments: ""
      - uses: EmbarkStudios/cargo-deny-action@v2
        continue-on-error: true # advisories are reported, not yet enforced
        with:
          command: check advisories
          arguments: ""

  frontend:
    name: Frontend (typecheck, lint, unit tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run lint
      - run: pnpm test

  relay-worker:
    name: Relay Worker (unit tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: relay/worker
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: relay/worker/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: relay/worker/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test

  ui:
    name: UI suite (headless Chromium)
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start the dev server
        run: |
          pnpm dev --port 1431 --strictPort --host 127.0.0.1 > vite.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:1431/ > /dev/null && exit 0
            sleep 1
          done
          cat vite.log
          exit 1
      - name: Run the suite
        run: MANANG_ORIGIN=http://127.0.0.1:1431 node scripts/verify-ui.mjs
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: artifacts/screens/
          retention-days: 7
