name: CI

# Minutes are a budget on a private repository (the free quota ran out once),
# so CI is in two tiers.
#
#  * quick: every push to main and every pull request, about 4 minutes. Formatting,
#    the banned-library check and the frontend.
#  * full:  once a week, on demand (Actions > CI > Run workflow), and on a pull
#    request labelled `full-ci`. Clippy and every Rust test, the wasm32 check,
#    licences and bans, and the headless-Chromium UI suite (30 to 40 minutes).
#
# Every gate also runs locally before a merge (AGENTS.md section 5), so the full
# tier is a safety net, not the first line. Run it before a release.
# Documentation-only changes run nothing. macOS and Windows runners cost 2 to 10
# times more per minute and are used for release builds only.
on:
  push:
    branches: [main]
    paths-ignore:
      ["docs/**", "**/*.md", "LICENSE", "CITATION.cff", ".github/ISSUE_TEMPLATE/**"]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      ["docs/**", "**/*.md", "LICENSE", "CITATION.cff", ".github/ISSUE_TEMPLATE/**"]
  schedule:
    - cron: "23 3 * * 0"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"
  # Do not add CARGO_* or RUSTFLAGS variables casually: they are part of the
  # rust-cache key, and a cold build compiles every dependency at opt-level 3
  # (the workspace's dev profile), which takes over 40 minutes.

jobs:
  quick:
    name: Quick checks (format, tree, frontend)
    # A labelled event only matters for the full tier.
    if: github.event.action != 'labeled'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: rustfmt
      - run: cargo fmt --all -- --check
      - name: No bundled C libraries in the app binary (AGENTS.md 7.4)
        run: |
          if cargo tree -p manang --locked | grep -iE "tectonic|harfbuzz|freetype-sys|icu4c|openssl-sys|openssl v|aws-lc"; then
            echo "::error::a banned crate is in the app's dependency tree"
            exit 1
          fi
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run lint
      - run: pnpm test

  rust:
    name: Rust (clippy, tests)
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-24.04
    timeout-minutes: 60 # a cold cache builds Typst and Wasmtime
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space
        # The runner starts with little free space for a workspace this size.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: System libraries for the Tauri shell
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev libayatana-appindicator3-dev libxdo-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev patchelf
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0" # the version we develop on; bump deliberately
          components: rustfmt, clippy
          # The plugin SDK and sandbox tests build WebAssembly plugins.
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          # Keep what was built even when a later step fails or times out, so
          # the next run starts warm instead of from scratch.
          cache-on-failure: true
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked --no-fail-fast
      - name: wasm32 check of the web-capable crates
        run: >
          cargo check --locked --target wasm32-unknown-unknown
          -p manang-agent-core -p manang-figure -p manang-diagram -p manang-live
          -p manang-visual -p manang-heal

  supply-chain:
    name: Licences and bans
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
          # The action defaults to --all-features, which would include the
          # optional Tectonic sidecar engine; deny.toml checks the app's graph.
          arguments: ""
      - uses: EmbarkStudios/cargo-deny-action@v2
        continue-on-error: true # advisories are reported, not yet enforced
        with:
          command: check advisories
          arguments: ""

  ui:
    name: UI suite (headless Chromium)
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start the dev server
        run: |
          pnpm dev --port 1431 --strictPort --host 127.0.0.1 > vite.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:1431/ > /dev/null && exit 0
            sleep 1
          done
          cat vite.log
          exit 1
      - name: Run the suite
        run: MANANG_BROWSER=google-chrome MANANG_ORIGIN=http://127.0.0.1:1431 node scripts/verify-ui.mjs
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-screenshots
          path: artifacts/screens/
          retention-days: 7
