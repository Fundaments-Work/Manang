name: release-engine

# Builds the optional built-in LaTeX engine (the `manang-latex-worker` sidecar,
# Tectonic inside) for the platforms we ship, hashes it, and uploads it as a
# workflow artifact. It does NOT publish anything: the lead downloads the
# artifact, uploads it to the engine host, pastes the printed manifest lines
# into engines/manifest.json and cuts an app release. See
# docs/ops/engine-release.md.
#
# Run it by hand (Actions > release-engine > Run workflow) or push a tag like
# `engine-v0.17.0`.

on:
  workflow_dispatch:
  push:
    tags:
      - "engine-v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Tectonic's C dependencies are found through pkg-config, and the worker must
  # carry ICU, FreeType, fontconfig and friends inside itself, so it runs on any
  # Linux with a recent glibc instead of only on a machine with the same ICU
  # version as the build machine.
  #
  # `PKG_CONFIG_ALL_STATIC` alone is NOT enough, and this was measured on
  # 2026-10-19: pkg-config refuses to link a library it considers a system one
  # statically even with that flag, so the worker still pulled in libicuuc.so,
  # libfreetype, libfontconfig, libgraphite2, libpng16, libz, libexpat, libbz2
  # and libbrotli (the check further down failed on exactly those).
  # `TECTONIC_PKGCONFIG_FORCE_SEMI_STATIC` is Tectonic's own switch: it makes
  # tectonic_dep_support emit `cargo:rustc-link-lib=static=...` itself, choosing
  # the archive when the .pkg-config found one is on disk (libc, libm, libdl and
  # libpthread stay dynamic, which is what we want).
  PKG_CONFIG_ALL_STATIC: "1"
  TECTONIC_PKGCONFIG_FORCE_SEMI_STATIC: "1"

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-24.04
            file: manang-latex-worker-linux-x86_64
          # GitHub's arm runner is free for public repositories (it is), and
          # the steps below are identical to x86_64.
          - platform: linux-aarch64
            os: ubuntu-24.04-arm
            file: manang-latex-worker-linux-aarch64
          # Cost and notes for the platforms that are declared in
          # engines/manifest.json but not built yet. Enable one by removing the
          # leading "#", then add its system-library step below.
          #
          # windows-x86_64: needs vcpkg (freetype, icu, harfbuzz, graphite2,
          # fontconfig) with the x64-windows-static-md triplet and
          # VCPKG_ROOT/RUSTFLAGS=-Ctarget-feature=+crt-static; the C++ ICU build
          # is slow (about 40 minutes cold; cache the vcpkg binary cache).
          # - platform: windows-x86_64
          #   os: windows-2025
          #   file: manang-latex-worker-windows-x86_64.exe
          #
          # macos-aarch64 / macos-x86_64: `brew install icu4c freetype
          # fontconfig harfbuzz graphite2` plus PKG_CONFIG_PATH for keg-only
          # icu4c; static linking against Homebrew bottles works but is
          # fiddly. macOS minutes cost 10x Linux minutes on private repos, and
          # the binaries need signing and notarisation before users can run
          # them (see the ops guide).
          # - platform: macos-aarch64
          #   os: macos-15
          #   file: manang-latex-worker-macos-aarch64
          # - platform: macos-x86_64
          #   os: macos-15-intel
          #   file: manang-latex-worker-macos-x86_64
    steps:
      - uses: actions/checkout@v7

      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # -dev packages ship the static .a files PKG_CONFIG_ALL_STATIC needs.
          sudo apt-get install -y --no-install-recommends \
            pkg-config libicu-dev libfreetype-dev libfontconfig-dev \
            libgraphite2-dev libpng-dev libexpat1-dev libbz2-dev \
            libbrotli-dev zlib1g-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: engine-${{ matrix.platform }}

      - name: Build the worker
        shell: bash
        # No default features: the sidecar must not carry the app's HTTP stack.
        run: >
          cargo build --release --locked -p manang-latex
          --no-default-features --features engine
          --bin manang-latex-worker

      - name: Stage the file under its release name
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          bin=target/release/manang-latex-worker
          [ "${{ runner.os }}" = "Windows" ] && bin="$bin.exe"
          cp "$bin" "dist/${{ matrix.file }}"

      - name: Check it is self-contained and runs (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          f="dist/${{ matrix.file }}"
          ldd "$f" || true
          # Only the C library, the compiler runtime and libgraphite2 may be
          # dynamic. Anything else (libicu, libfreetype, ...) means a user
          # without it cannot run the engine; fail here rather than at their
          # first compile.
          #
          # libgraphite2 is the one exception. HarfBuzz (from the copy vendored
          # in tectonic_bridge_harfbuzz) is compiled with HAVE_GRAPHITE2, and
          # Debian and Ubuntu ship libgraphite2-dev without a static archive,
          # so Tectonic's semi-static mode cannot fold it into the worker. It is
          # a 200 KB library that a full desktop font stack already pulls in, and
          # the app smoke-tests the binary before it keeps it, so a machine
          # without it gets "the downloaded engine cannot start on this
          # computer" rather than a broken install. Building a static graphite2
          # in this job and dropping the archive where pkg-config points would
          # remove the exception; see docs/ops/engine-release.md.
          # The dynamic loader is /lib64/ld-linux-x86-64.so.2 on x86-64 and
          # /lib/ld-linux-aarch64.so.1 on arm64, so match it by name rather
          # than by directory.
          bad=$(ldd "$f" | awk '{print $1}' | grep -vE '^(linux-vdso|libc|libm|libgcc_s|libstdc\+\+|libpthread|libdl|librt|libgraphite2)(\.so[0-9.]*)?$|(^|/)ld-?linux[^ ]*$' || true)
          if [ -n "$bad" ]; then
            echo "::error::dynamic libraries that users may not have:"; echo "$bad"; exit 1
          fi
          "$f" --version

      - name: Compile a document with it (needs the network once)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          cp testdata/corpus/latex-article/main.tex "$work/"
          cp testdata/corpus/latex-article/references.bib "$work/"
          mkdir -p "$work/out" "$work/cache"
          cat > "$work/request.json" <<EOF
          {"main":"$work/main.tex","root":"$work","out_dir":"$work/out","bundle":null,"cache_dir":"$work/cache","only_cached":false,"synctex":true,"build_epoch":1700000000}
          EOF
          "dist/${{ matrix.file }}" "$work/request.json"
          cat "$work/out/outcome.json"; echo
          grep -q '"failure":null' "$work/out/outcome.json"
          test -s "$work/out/main.pdf"

      - name: Hash and print the manifest lines
        shell: bash
        run: |
          set -euo pipefail
          f="dist/${{ matrix.file }}"
          size=$(wc -c < "$f" | tr -d ' ')
          if command -v sha256sum >/dev/null; then sum=$(sha256sum "$f" | cut -d' ' -f1); else sum=$(shasum -a 256 "$f" | cut -d' ' -f1); fi
          printf '%s  %s\n' "$sum" "${{ matrix.file }}" > "dist/${{ matrix.file }}.sha256"
          {
            echo "### ${{ matrix.platform }}"
            echo
            echo "Paste into \`engines/manifest.json\` under \`platforms\`:"
            echo
            echo '```json'
            echo "\"${{ matrix.platform }}\": {"
            echo "  \"status\": \"built\","
            echo "  \"file\": \"${{ matrix.file }}\","
            echo "  \"size\": $size,"
            echo "  \"sha256\": \"$sum\""
            echo "},"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: engine-${{ matrix.platform }}
          path: |
            dist/${{ matrix.file }}
            dist/${{ matrix.file }}.sha256
          if-no-files-found: error
          retention-days: 30

  version:
    name: read the engine version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        run: |
          set -euo pipefail
          version="$(python3 -c "import json;print(json.load(open('engines/manifest.json'))['version'])")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Attaches the built files to the `tectonic-<version>` release, which is
  # where the app looks: with MANANG_ENGINE_BASE_URL set to
  # https://github.com/Fundaments-Work/Manang/releases/download, the worker
  # fetches <base>/tectonic-<version>/<file>, so the asset name and the tag
  # have to be exactly these. Rerunning the workflow replaces the asset, which
  # is how a rebuilt binary gets out (the embedded manifest in engines/
  # manifest.json has to carry the new hash, or the app refuses it, so a
  # rebuild only ships once that file is committed with the numbers printed
  # in the job summary above).
  publish:
    name: publish to the tectonic-${{ needs.version.outputs.version }} release
    needs: [build, version]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - name: Download what the build job produced
        uses: actions/download-artifact@v6
        with:
          pattern: engine-*
          path: dist
          merge-multiple: true
      - name: Create or update the release
        run: |
          set -euo pipefail
          tag="tectonic-${VERSION}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            # Pre-release on purpose: this release is a download for the app,
            # not something a person installs, and GitHub's "latest release"
            # should keep pointing at the app. (scripts/install-linux.sh skips
            # releases that carry no installer, so the flag cannot confuse it.)
            gh release create "$tag" --verify-tag --prerelease --title "Tectonic ${VERSION} engine" \
              --notes "The built-in LaTeX engine (Tectonic ${VERSION}) for Manang.

          Downloaded by the app after the user agrees, verified against the size and
          SHA-256 compiled into Manang (engines/manifest.json). See
          docs/ops/engine-release.md. Nothing here is run by the app directly; the
          host only serves bytes."
          fi
          for f in dist/manang-latex-worker-* dist/*.sha256; do
            [ -e "$f" ] || continue
            echo "uploading $(basename "$f")"
            gh release upload "$tag" "$f" --clobber
          done
          gh release view "$tag" --json assets --jq '.assets[] | "\(.name)  \(.size)"'
