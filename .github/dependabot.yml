version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, rust]
    groups:
      # The npm @tauri-apps packages and the Rust tauri crates must share a
      # major.minor (AGENTS.md 7.4); the npm group below moves with this one.
      tauri:
        patterns: ["tauri", "tauri-*"]
      rust-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Pinned deliberately: the agent provider layer (docs/research Rig notes).
      - dependency-name: rig-core
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, frontend]
    groups:
      tauri:
        patterns: ["@tauri-apps/*"]
      frontend-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, ci]
