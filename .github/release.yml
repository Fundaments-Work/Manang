changelog:
  exclude:
    labels: [skip-changelog]
    authors: [dependabot]
  categories:
    - title: New
      labels: [feature, enhancement]
    - title: Fixed
      labels: [bug]
    - title: Safety and security
      labels: [security, data-safety]
    - title: Documentation
      labels: [documentation]
    - title: Other changes
      labels: ["*"]
