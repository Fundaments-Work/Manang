[workspace]
resolver = "3"
members = [
    "src-tauri",
    "crates/manang-kernel",
    "crates/manang-wasm-host",
    "crates/manang-plugins",
    "crates/manang-editor",
    "crates/manang-typst",
    "crates/manang-latex",
    "crates/manang-project",
    "crates/manang-buffer",
    "crates/manang-figure",
    "crates/manang-settings",
    "crates/manang-git",
    "crates/manang-search",
    "crates/manang-writing",
    "crates/manang-markdown",
    "crates/manang-citations",
    "crates/manang-diagram",
    "crates/manang-agent-core",
    "crates/manang-agent-providers",
    "crates/manang-keystore",
    "crates/manang-formats",
    "crates/manang-recovery",
    "crates/manang-agent-rig",
    "crates/manang-agent",
    "crates/manang-live",
    "crates/manang-relay",
    "crates/manang-live-plugin",
]
exclude = [
    "crates/manang-wasm-host/tests/fixtures/echo-guest",
    "crates/manang-wasm-host/tests/fixtures/io-guest",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Fundaments.work"]
repository = "https://github.com/Fundaments-Work/Manang"
rust-version = "1.95"

[workspace.dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
# `preserve_order`: merman-core (manang-diagram) requires it, and Cargo turns a
# feature on for every crate built together, so the app always has it. Declared
# here so a crate tested alone (`-p`) serialises JSON objects the same way.
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"

# Profiles must live in the workspace root manifest, not in a member crate, or
# Cargo silently ignores them.

# Development builds: our own crates stay quick to rebuild, but every
# dependency (Typst, Wasmtime, gix, the TeX parsers...) is optimised, because
# an unoptimised Typst compiles 10-50x slower and makes `tauri dev` feel
# nothing like the real app. Dependencies rebuild rarely, so the cost is paid
# once. Line tables only keep backtraces readable while cutting link time.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

# Build scripts and proc macros run at compile time only; optimising them
# speeds up builds of crates that lean on them (serde, typst macros).
[profile.dev.build-override]
opt-level = 3
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
