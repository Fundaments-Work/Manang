[workspace]
resolver = "3"
members = ["src-tauri", "crates/manang-kernel", "crates/manang-wasm-host", "crates/manang-editor", "crates/manang-project"]
exclude = ["crates/manang-wasm-host/tests/fixtures/echo-guest"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Fundaments.work"]
repository = "https://github.com/Fundaments-Work/Manang"
rust-version = "1.85"

[workspace.dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Release profile must live in the workspace root manifest, not in a member
# crate, or Cargo silently ignores it.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
