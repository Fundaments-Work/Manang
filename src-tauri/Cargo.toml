[package]
name = "manang"
description = "The High-Performance Scientific Authoring & Illustration Suite"
authors = ["Fundaments.work"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name.
name = "manang_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { workspace = true }
tauri-plugin-opener = { workspace = true }
# 2.8 is the stable line for Tauri 2.12 (the plugin has its own version track).
tauri-plugin-dialog = "2.8"
# Each plugin's npm package (@tauri-apps/plugin-*) must stay on the same
# major.minor as its crate, or `tauri dev` refuses to start.
tauri-plugin-window-state = "2.5"
tauri-plugin-os = "2.4"
tauri-plugin-process = "2.4"
tauri-plugin-log = "2.10"
log = "0.4"

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
tauri-plugin-single-instance = "2.5"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
manang-kernel = { path = "../crates/manang-kernel" }
manang-editor = { path = "../crates/manang-editor" }
manang-project = { path = "../crates/manang-project" }
manang-typst = { path = "../crates/manang-typst" }
manang-latex = { path = "../crates/manang-latex" }
manang-search = { path = "../crates/manang-search" }
manang-git = { path = "../crates/manang-git" }
manang-settings = { path = "../crates/manang-settings" }
manang-figure = { path = "../crates/manang-figure" }
manang-writing = { path = "../crates/manang-writing" }
manang-markdown = { path = "../crates/manang-markdown" }
manang-diagram = { path = "../crates/manang-diagram" }
manang-citations = { path = "../crates/manang-citations" }
manang-plugins = { path = "../crates/manang-plugins" }
manang-wasm-host = { path = "../crates/manang-wasm-host" }

[dev-dependencies]
tempfile = "3"
