[package]
name = "manang"
description = "The High-Performance Scientific Authoring & Illustration Suite"
authors = ["Fundaments.work"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name.
name = "manang_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { workspace = true }
tauri-plugin-opener = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
manang-kernel = { path = "../crates/manang-kernel" }
manang-editor = { path = "../crates/manang-editor" }
